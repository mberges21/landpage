name: Update latest release + Bandcamp

on:
  schedule:
    - cron: '0 7 * * *'   # every day at 07:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Deezer for the newest release
        run: python3 scripts/update_latest_release.py

      - name: Refresh Bandcamp releases for the shop
        run: python3 scripts/sync_bandcamp.py || echo "::warning::Bandcamp sync failed — shop keeps the last list"

      - name: Commit and publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet assets/data/latest-release.json assets/data/bandcamp.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/latest-release.json assets/data/bandcamp.json
          git commit -m "Update latest release / Bandcamp list"
          git push
          # pushes made by this workflow's token don't always trigger a Pages rebuild, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
